# ==============================================
# Hexo 站点主配置
# 只需要改这一份里的 url / title / author
# ==============================================

# ---- Site 站点信息 ----
title: 雨季不再来
subtitle: '明写春诗'
description: '学习笔记 · 记录与分享'
keywords: 博客, 深度学习, 编程
author: Delancey113
language: zh-CN
timezone: Asia/Shanghai

# ---- URL 站点地址（⚠️ 必须改成你自己的）----
# 格式：https://你的用户名.github.io
# 如果仓库名不是 username.github.io，则写成 https://用户名.github.io/仓库名
url: https://yourname.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---- Directory 目录 ----
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---- Writing 写作 ----
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ---- 分类与标签 ----
default_category: uncategorized
category_map:
tag_map:

# ---- 日期格式 ----
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ---- 分页 ----
per_page: 10
pagination_dir: page

# ---- 首页生成 ----
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ---- 归档 ----
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  daily: false
  order_by: -date

# ---- 主题（Butterfly）----
theme: butterfly

# ---- 本地搜索（hexo-generator-searchdb）----
search:
  path: search.xml
  field: post
  content: true
  format: ''

# ---- RSS ----
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# ---- 扩展 ----
theme_config:
  # 这里留空，主题配置统一写在 _config.butterfly.yml
