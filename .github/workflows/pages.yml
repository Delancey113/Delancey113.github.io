name: Deploy Pages
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        run: |
          bundle add jekyll jekyll-remote-theme jekyll-include-cache
          bundle install
      - name: Build site
        run: bundle exec jekyll build
      - name: Deploy
        uses: actions/deploy-pages@v4
